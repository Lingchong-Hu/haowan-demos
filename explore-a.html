<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f7f3ee" />
<title>旅程 · 好玩的东西</title>
<meta name="description" content="互动版入口 A：大厅出发，有限选择一步步引导——四个板块、四个项目方向、行业、再到像故事一样讲给你听的每个 demo。" />
<script src="assets/i18n.js"></script>
<script>
try { sessionStorage.setItem('gg-journey', '1'); } catch (e) {}
</script>
<!-- ═══════════════════════════════════════════════════════════════════
     互动版入口 · A 版「旅程」v2 —— 大厅-支线 选择机（state machine，非长滚动页）
     · 大厅 = 4 张浮动选项卡（认识团队/逛项目/读思考/找到我），走完一支自动回大厅
     · 逛项目三层漏斗：4 个方向 → 细化行业 → 具体 demo（绝不一次倒出 36 个）
     · demo 不再是信息卡，而是「story 场景」：流式文字逐句浮现，像讲故事一样引导阅读
     · 顶栏面包屑随时回溯任意层级；hash 路由支持浏览器返回键/刷新/直链
     · 打点：大厅各支线 exp-a-*、方向 exp-a-dir*、故事 exp-a-s-<id>；留言 slug 同前缀
     · 内容全部读 data.js；四方向映射在 DIRS（新行业没映射会自动落进「生活」）
     ═══════════════════════════════════════════════════════════════════ -->
<style>
@font-face{font-family:'Fraunces';src:url('assets/fonts/fraunces-latin.woff2') format('woff2');
  font-weight:100 900;font-display:swap}
:root{--bg:#f7f3ee;--card:#fffdfa;--ink:#2b2320;--ink-soft:#6b6058;--line:#ded3c6;
  --accent:#b4542e;--accent-soft:#c98a5a;
  --serif:'Fraunces',Georgia,'Noto Serif SC',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.75 var(--sans);overflow-x:clip;min-height:100svh}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

/* ---------- 背景流体 ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform}
.b1{width:52vmax;height:52vmax;left:-18vmax;top:-14vmax;background:#f0e0cd;animation:drift1 26s ease-in-out infinite alternate}
.b2{width:44vmax;height:44vmax;right:-16vmax;top:26%;background:#ecd9d0;animation:drift2 32s ease-in-out infinite alternate}
.b3{width:40vmax;height:40vmax;left:8%;bottom:-18vmax;background:#e7e3d2;animation:drift1 38s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(6vmax,4vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-5vmax,-6vmax) scale(.94)}}

/* ---------- 顶栏：面包屑 + 探索度 ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:12px 18px calc(12px);padding-top:calc(12px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.crumbs{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;white-space:nowrap}
.crumbs::-webkit-scrollbar{display:none}
.crumb{font:600 13px var(--sans);color:var(--ink-soft);background:none;border:0;cursor:pointer;
  padding:6px 9px;border-radius:9px;transition:all .18s;flex:none}
.crumb:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.crumb.cur{color:var(--ink);cursor:default;background:none}
.crumbs .sep{color:var(--line);font-size:12px;flex:none}
.score{font:600 12.5px var(--sans);color:var(--ink-soft);flex:none}
.score b{color:var(--accent)}
.lang-toggle{display:inline-flex;gap:2px;flex:none;margin-left:4px}
.lang-toggle button{font:600 11.5px var(--sans);color:var(--ink-soft);background:none;
  border:1px solid transparent;border-radius:8px;padding:4px 8px;cursor:pointer}
.lang-toggle button.active{color:var(--accent);border-color:var(--line);background:var(--card)}

/* ---------- 场景容器 & 切换 ---------- */
#stage{position:relative;z-index:1;max-width:940px;margin:0 auto;
  padding:calc(76px + env(safe-area-inset-top)) 22px 90px;min-height:100svh;
  display:flex;flex-direction:column;justify-content:center}
/* 大屏自适应：分辨率越高整体放大，别让内容缩在一角（min-height 补偿 zoom 保持垂直居中） */
@media (min-width:1500px){body{zoom:1.15;min-height:calc(100svh/1.15)}#stage{min-height:calc(100svh/1.15)}}
@media (min-width:1800px){body{zoom:1.3;min-height:calc(100svh/1.3)}#stage{min-height:calc(100svh/1.3)}}
@media (min-width:2300px){body{zoom:1.55;min-height:calc(100svh/1.55)}#stage{min-height:calc(100svh/1.55)}}
.sc{animation:scIn .42s cubic-bezier(.2,.8,.25,1) both}
@keyframes scIn{from{opacity:0;transform:translateY(26px)}to{opacity:1}}
.kick{font:600 13px var(--sans);letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
h1{font:600 clamp(36px,6.6vw,62px)/1.2 var(--serif)}
h2{font:600 clamp(27px,4.8vw,40px)/1.28 var(--serif)}
.lead{color:var(--ink-soft);max-width:620px;margin-top:12px}

/* ---------- 选项卡（大厅/方向/行业 通用） ---------- */
.cards{display:grid;gap:16px;margin-top:40px}
.cards.n4,.cards.n5{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.cards.slim{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.ocard{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:24px 22px 20px;cursor:pointer;font-family:var(--sans);color:var(--ink);
  box-shadow:0 10px 34px rgba(63,44,28,.09);text-decoration:none;display:block;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s;
  animation:rise .6s cubic-bezier(.2,.8,.25,1) both,float 5.6s ease-in-out infinite}
.cards>*:nth-child(1){animation-delay:.08s,.9s}.cards>*:nth-child(2){animation-delay:.16s,1.7s}
.cards>*:nth-child(3){animation-delay:.24s,2.5s}.cards>*:nth-child(4){animation-delay:.32s,3.3s}
.cards>*:nth-child(n+5){animation-delay:.4s,2s}
@keyframes rise{from{opacity:0;transform:translateY(38px) scale(.95)}to{opacity:1}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
.ocard:hover{transform:translateY(-6px) rotate(-.5deg);box-shadow:0 20px 48px rgba(63,44,28,.16);border-color:var(--accent-soft)}
.ocard .em{font-size:28px;line-height:1}
.ocard h3{font:600 18px/1.35 var(--serif);margin:11px 0 5px}
.ocard p{font-size:13px;color:var(--ink-soft);line-height:1.6}
.ocard .go{margin-top:13px;font:600 13px var(--sans);color:var(--accent)}
.ocard .done{position:absolute;top:13px;right:15px;font:600 11px var(--sans);color:#fff;
  background:var(--accent-soft);border-radius:999px;padding:3px 9px}
.ocard .cnt{position:absolute;top:13px;right:15px;font:600 11.5px var(--sans);color:var(--accent-soft)}
.hint{margin-top:40px;color:var(--ink-soft);font-size:13px;text-align:center}
/* 大厅五条旅程支线之后的小选项：不跟旅程，去经典整站自由翻 */
.freebar{margin-top:22px;text-align:center}
.freebar a{display:inline-flex;align-items:center;gap:8px;font:600 13.5px var(--sans);
  color:var(--ink-soft);border:1px dashed var(--line);border-radius:999px;padding:10px 20px;
  text-decoration:none;transition:color .18s,border-color .18s,background .18s}
.freebar a:hover{color:var(--accent);border-color:var(--accent);background:var(--card)}

/* ---------- 故事流（demo / 团队共用） ---------- */
.story{max-width:640px}
.story .bt{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease;
  margin-top:18px;font-size:16.5px;line-height:1.9;color:var(--ink)}
.story .bt.in{opacity:1;transform:none}
.story .bt.dim{color:var(--ink-soft);font-size:15px}
.story .bt.big{font:600 clamp(26px,4.6vw,38px)/1.3 var(--serif);margin-top:22px}
.story .bt.tagline{font:600 12.5px var(--sans);letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-top:0}
.story .bt.kw{font:500 13px var(--sans);color:var(--accent-soft);margin-top:22px}
.skipnote{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  font:500 12px var(--sans);color:var(--ink-soft);opacity:.75;z-index:5;pointer-events:none;white-space:nowrap}
.fin{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s;margin-top:34px}
.fin.in{opacity:1;transform:none}

/* ---------- 按钮 ---------- */
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px var(--sans);
  border-radius:12px;padding:12px 20px;text-decoration:none;cursor:pointer;border:0;transition:filter .18s,transform .12s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{filter:brightness(1.08)}
.btn-g{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn-g:hover{border-color:var(--accent-soft)}
.navrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:26px}
.navlink{font:600 13.5px var(--sans);color:var(--ink-soft);background:none;border:0;cursor:pointer;padding:4px 0}
.navlink:hover{color:var(--accent)}

/* ---------- 完成卡 / 倒计时回大厅 ---------- */
.donecard{margin-top:38px;background:color-mix(in srgb,var(--accent) 7%,var(--card));
  border:1px solid var(--accent-soft);border-radius:18px;padding:20px 22px;display:flex;
  align-items:center;gap:16px;flex-wrap:wrap}
.donecard .tick{font-size:22px}
.donecard .msg{flex:1;min-width:180px;font:600 14.5px var(--sans)}
.donecard .msg small{display:block;font:400 12.5px var(--sans);color:var(--ink-soft);margin-top:2px}

/* ---------- 留一句 ---------- */
.ask{margin-top:34px;background:color-mix(in srgb,var(--accent) 6%,var(--card));
  border:1px dashed var(--accent-soft);border-radius:18px;padding:22px;max-width:640px}
.ask h5{font:600 16px var(--serif);margin-bottom:3px}
.ask small{color:var(--ink-soft);font-size:12.5px;display:block;margin-bottom:12px}
.ask textarea,.ask input{width:100%;font:400 14px var(--sans);color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;margin-bottom:9px}
.ask textarea{min-height:60px;resize:vertical}
.ask textarea:focus,.ask input:focus{border-color:var(--accent-soft)}
.ask .row{display:flex;gap:9px;flex-wrap:wrap}
.ask .row input{flex:1;min-width:190px;margin-bottom:0}
.ask .ok{font:600 15px var(--sans);color:var(--accent);padding:8px 0}
.ask .err{font-size:12.5px;color:var(--accent);margin-top:6px}

/* ---------- 行业/项目 列表卡 ---------- */
.lcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:17px 19px;cursor:pointer;text-align:left;width:100%;font-family:var(--sans);
  color:var(--ink);transition:transform .2s,border-color .2s,box-shadow .2s;
  animation:rise .5s cubic-bezier(.2,.8,.25,1) both}
.lcard:hover{transform:translateX(5px);border-color:var(--accent-soft);box-shadow:0 10px 28px rgba(63,44,28,.1)}
.lcard .t{flex:1}
.lcard h4{font:600 16px/1.35 var(--serif)}
.lcard p{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcard .arr{color:var(--accent);font-weight:700;flex:none}
.lcard .n{font:600 12px var(--sans);color:var(--accent-soft);flex:none}
.lcard .stage-badge{display:inline-flex;font:600 10.5px var(--sans);color:var(--accent);
  background:color-mix(in srgb,var(--accent) 8%,var(--card));border:1px solid var(--accent-soft);
  border-radius:999px;padding:3px 8px;margin-bottom:7px}
.stack{display:flex;flex-direction:column;gap:11px;margin-top:32px;max-width:640px}
.stack>*:nth-child(1){animation-delay:.05s}.stack>*:nth-child(2){animation-delay:.11s}
.stack>*:nth-child(3){animation-delay:.17s}.stack>*:nth-child(4){animation-delay:.23s}
.stack>*:nth-child(5){animation-delay:.29s}.stack>*:nth-child(6){animation-delay:.35s}
.stack>*:nth-child(7){animation-delay:.41s}.stack>*:nth-child(n+8){animation-delay:.47s}

/* ---------- 旅程内读全文（思考原文迁入旅程） ---------- */
.fulltext{margin-top:26px;max-width:640px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:26px 26px 16px;animation:scIn .4s both}
.fulltext h2{font:600 21px/1.4 var(--serif);margin:24px 0 10px}
.fulltext p{margin:12px 0;font-size:15.5px;line-height:1.85}
.fulltext .lede{font-size:16.5px}
.fulltext blockquote{margin:14px 0;padding:8px 16px;border-left:3px solid var(--accent-soft);color:var(--ink-soft)}
.fulltext ul,.fulltext ol{padding-left:22px}
.fulltext li{margin:6px 0}
.fulltext img{max-width:100%;border-radius:10px}

/* ---------- 联系 ---------- */
.contactrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.copybtn{font:500 14px var(--sans);background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 18px;cursor:pointer;color:var(--ink);transition:border-color .2s;text-decoration:none}
.copybtn:hover{border-color:var(--accent-soft)}
footer{position:relative;z-index:1;text-align:center;padding:0 22px 26px;color:var(--ink-soft);font-size:12px}
footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="topbar">
  <div class="crumbs" id="crumbs"></div>
  <div class="score"><span id="scoreLbl">已探索</span> <b id="scoreN">0</b>/5</div>
  <span class="lang-toggle" role="group" aria-label="Language"><button type="button" data-lang-btn="en">EN</button><button type="button" data-lang-btn="zh">中文</button></span>
</div>
<main id="stage"></main>
<footer><span id="fLbl">经典版：</span><a id="fHome" href="index.html">首页</a> · <a id="fDemos" href="demos.html">全部 Demo</a> · <a id="fThoughts" href="thoughts.html">全部思考</a></footer>

<script src="data.js"></script>
<script>
const S = window.SITE, P = window.PROJECTS;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
const API = LOCAL ? '' : 'https://api.interantai.com';
const post = (path, data) => fetch(API + path, { method: 'POST',
  headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(data), keepalive: true });
const c = S.contact;
/* —— i18n：window.LANG 由 assets/i18n.js 提前设好；data.js 已按语言换好 S/P —— */
const EN = window.LANG === 'en';
const T = (zh, en) => (EN && en != null) ? en : zh;
function leaveJourney() {
  try { sessionStorage.setItem('gg-journey', '0'); } catch (e) {}
}
$$('footer a[href]').forEach(a => a.addEventListener('click', leaveJourney));
/* 面包屑公共标签 */
const L = {
  hub: T('⌂ 大厅', '⌂ Hub'), about: T('认识团队', 'About the team'),
  team: T('完整团队', 'Full team'), dirs: T('逛项目', 'Projects'),
  thoughts: T('读思考', 'Essays'), ongoing: T('在建项目', 'Ongoing projects'),
  contact: T('找到我', 'Find me')
};
if (EN) {
  document.title = 'Tour · Playground';
  $('#scoreLbl').textContent = 'Explored';
  /* 页脚只换文字不重建链接（链接保持在 <footer> 的明确退出白名单里） */
  $('#fLbl').textContent = 'Classic site: ';
  $('#fHome').textContent = 'Home';
  $('#fDemos').textContent = 'All Demos';
  $('#fThoughts').textContent = 'All Essays';
}

/* ═══════════ 四个方向（新行业没映射会自动落进「生活」；cats 按当前语言的数据集匹配） ═══════════ */
const DIRS = [
  { emoji: '🌏', name: T('出海，把生意做到全世界', 'Go global, sell to the world'), short: T('出海', 'Global'),
    line: T('选品、定价、上架——跨境价值链的每一环。', 'Sourcing, pricing, listing — every link in the cross-border chain.'),
    cats: EN ? ['Cross-border'] : ['跨境电商', '外贸'] },
  { emoji: '🏢', name: T('企业里最磨人的活，交给系统', 'The grind inside companies, systemized'), short: T('企业', 'Business'),
    line: T('采购价格、财务、保险、接待……难活自动化。', 'Procurement pricing, finance, insurance, front desk… automate the hard parts.'),
    cats: EN ? ['Restaurant Supply', 'Finance', 'Insurance', 'Productivity', 'Short-stay'] : ['餐饮供应链', '法律', '金融', '保险', '效率', '短租民宿'] },
  { emoji: '🛍️', name: T('生活：吃穿住行玩学', 'Everyday life: eat, wear, go, play, learn'), short: T('生活', 'Life'),
    line: T('穿搭、找车、今晚吃什么、去哪玩、怎么学。', 'Outfits, cars, tonight’s dinner, where to go, how to learn.'),
    cats: EN ? ['Fashion', 'Auto', 'Food', 'Travel', 'Dating', 'Games', 'Education', 'Hiring'] : ['时尚', '汽车', '餐饮', '旅行', '约会', '游戏', '教育', '招聘'] },
  { emoji: '🏡', name: T('照护家里的每一个人', 'Care for everyone at home'), short: T('照护', 'Care'),
    line: T('母婴、宠物、爸妈的养老，还有留学在外的孩子。', 'Parenting, pets, aging parents — and the kid studying abroad.'),
    cats: EN ? ['Health', 'Pets', 'Parenting', 'Mental Health', 'Eldercare', 'Study Abroad', 'Student Housing', 'Real Estate'] : ['医疗', '宠物', '母婴', '心理', '养老', '留学', '留学租房', '房产'] }
];
const mapped = new Set(DIRS.flatMap(d => d.cats));
[...new Set(P.map(p => p.cat))].forEach(x => { if (!mapped.has(x)) DIRS[2].cats.push(x); });
const byCat = cat => P.filter(p => p.cat === cat);
const dirCount = d => d.cats.reduce((n, x) => n + byCat(x).length, 0);

/* ═══════════ 打点 / 留言 ═══════════ */
function hit(slug) {
  try {
    const k = 'exp-a-hit:' + slug;
    if (sessionStorage.getItem(k)) return;
    sessionStorage.setItem(k, '1');
    post('/hit', { slug, ev: 'view' }).catch(() => {});
  } catch (e) {}
}
function askHtml(slug, q, ph) {
  return `<div class="ask" data-slug="${slug}">
    <h5>${q}</h5><small>${T('写一句就行。留了联系方式的，48 小时内回你。', 'One line is enough. Leave contact info and I reply within 48h.')}</small>
    <textarea placeholder="${ph}" maxlength="1000"></textarea>
    <div class="row"><input placeholder="${T('微信 / 邮箱（选填）', 'WeChat / email (optional)')}" maxlength="120" />
    <button class="btn btn-p">${T('发送', 'Send')}</button></div>
    <div class="err" style="display:none"></div></div>`;
}
function wireAsks(root) {
  $$('.ask', root).forEach(box => {
    const ta = $('textarea', box), ct = $('input', box), btn = $('.btn-p', box), err = $('.err', box);
    btn.onclick = () => {
      const text = ta.value.trim();
      if (text.length < 2) { err.textContent = T('多写几个字，我才知道怎么帮你 :)', 'Say a bit more so I can actually help :)'); err.style.display = ''; ta.focus(); return; }
      btn.disabled = true; err.style.display = 'none';
      post('/feedback', { slug: box.dataset.slug, text, contact: ct.value.trim() })
        .then(r => r.json()).then(r => {
          if (!r || !r.ok) throw 0;
          ct.value.trim()
            ? box.innerHTML = `<div class="ok">${T('收到，谢谢！🙏 会尽快回你。', 'Got it, thank you! 🙏 I will get back to you soon.')}</div>`
            : askContact(box, box.dataset.slug, text);
        }).catch(() => {
          btn.disabled = false;
          err.textContent = T('发送失败了——可以直接加微信 ', 'Failed to send — reach me on WeChat ') + c.wechatId; err.style.display = '';
        });
    };
  });
}

/* 快进：全局只挂一次，永远只作用于"当前"故事（finishFn 随场景更换） */
stage.addEventListener('pointerdown', e => {

let rendered = null;                       /* 已渲染的路径串，用来吞掉自己触发的 hashchange */
function go(parts) {                       /* parts: ['story','probe'] 等 */
  location.hash = '/' + parts.map(encodeURIComponent).join('/');
  render(parts);
}
function replaceRoute(parts) {             /* 非法地址只替换当前历史项，避免“后退→非法→再推回退”的陷阱 */
  const hash = '#/' + parts.map(encodeURIComponent).join('/');
  history.replaceState(null, '', location.pathname + location.search + hash);
  render(parts);
}
addEventListener('hashchange', () => {
  const parts = parseHash();
  if (!parts) return replaceRoute([]);
  if (parts.join('/') !== rendered) render(parts);
});
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return [];
  const parts = [];
  for (const part of h.split('/')) {
    try { parts.push(decodeURIComponent(part)); }
    catch (e) { return null; }
  }
  return parts;
}

/* ═══════════ 故事引擎：逐句浮现，点击任意处快进 ═══════════ */
function playStory(beats, doneHtml, opts) {
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'story';
  wrap.innerHTML = beats.map(b =>
    `<div class="bt ${b.cls || ''}">${b.html}</div>`).join('') +
    `<div class="fin">${doneHtml}</div>`;
  const skip = document.createElement('div');
  skip.className = 'skipnote'; skip.textContent = T('✦ 点击任意处可以快进', '✦ Click anywhere to fast-forward');
  document.body.appendChild(skip);
  const bts = $$('.bt', wrap), fin = $('.fin', wrap);
  let i = 0;
  const finish = () => {
    clearInterval(storyTimer); storyTimer = null; finishFn = null;
    bts.forEach(b => b.classList.add('in'));
    fin.classList.add('in'); skip.remove();
    if (opts.onDone) opts.onDone();
  };
  const next = () => {
    if (i >= bts.length) return finish();
    bts[i++].classList.add('in');
  };
  next();
  storyTimer = setInterval(next, opts.pace || 950);
  finishFn = finish;
  return wrap;
}
function sentences(html, max) {
  const d = document.createElement('div'); d.innerHTML = html || '';
  const t = (d.textContent || '').replace(/\s+/g, ' ').trim();
  /* 中文按句末标点切；英文按 .!? 后接空格切（e.g./i.e. 缩写不算句尾） */
  return t ? t.split(/(?<=[。！？；])|(?<=[.!?])(?<!e\.g\.)(?<!i\.e\.)\s+/).map(s => s.trim()).filter(s => s.length > 3).slice(0, max || 6) : [];
}

/* 倒计时自动回大厅（交互即取消） */
function countdown(card, secs) {
  let n = secs;
  const num = $('.cd-n', card);
  const events = ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart', 'focusin'];
  const cleanup = () => {
    events.forEach(type => document.removeEventListener(type, cancel, true));
    document.removeEventListener('visibilitychange', cancel, true);
    if (cancelCountdownWatch === cleanup) cancelCountdownWatch = null;
  };
  const isHomeAction = e => {
    const home = e && e.target && e.target.closest && e.target.closest('[data-home]');
    return !!home && (e.type === 'pointerdown' || e.type === 'touchstart' ||
      (e.type === 'keydown' && (e.key === 'Enter' || e.key === ' ')));
  };
  const cancel = e => {
    if (e && e.type === 'visibilitychange' && !document.hidden) return;
    if (isHomeAction(e)) return;
    if (cdTimer) {
      clearInterval(cdTimer); cdTimer = null;
      const m = $('.msg', card);
      if (m) m.innerHTML = T('不急，慢慢看 ☕<small>想走的时候点右边</small>', 'No rush ☕<small>Use the button whenever you are ready</small>');
    }
    cleanup();
  };
  events.forEach(type => document.addEventListener(type, cancel, true));
  document.addEventListener('visibilitychange', cancel, true);
  cancelCountdownWatch = cleanup;
  cdTimer = setInterval(() => {
    n--; if (num) num.textContent = n;
    if (n <= 0) { clearInterval(cdTimer); cdTimer = null; cleanup(); go([]); }
  }, 1000);
}

/* ═══════════ 各场景 ═══════════ */
function clearTimers() {
  if (storyTimer) { clearInterval(storyTimer); storyTimer = null; }
  if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
  if (cancelCountdownWatch) cancelCountdownWatch();
  finishFn = null;
  $$('.skipnote').forEach(el => el.remove());
}

}

/* —— demo 故事场景：流式文字，像讲故事 —— */
function scStory(id) {
  const p = P.find(x => x.id === id); if (!p) return replaceRoute(['dirs']);
  hit('exp-a-s-' + id);
  const di = DIRS.findIndex(d => d.cats.includes(p.cat));
  const d = DIRS[di] || DIRS[2];
  crumbs([[L.hub, []], [L.dirs, ['dirs']], [d.short, ['dir', String(di)]],
          [p.cat, ['cat', String(di), p.cat]], [p.title.slice(0, 8) + (p.title.length > 8 ? '…' : ''), null]]);
  const sc = setScene(`<div id="mount"></div>`);

  const secs = p.sections || [];
  const what = secs.find(s => s.label === '是什么' || s.label === 'What it is');
  const biz = secs.find(s => s.label === '商业模式' || s.label === 'Business model');
  const beats = [
    { cls: 'tagline', html: `${p.cat} · ${p.kicker}` },
    { cls: 'big', html: p.title },
    { cls: 'dim', html: p.subtitle },
    ...sentences(what && what.html, 4).map(s => ({ html: s })),
    ...sentences(biz && biz.html, 1).map(s => ({ html: '💰 ' + s })),
    { cls: 'kw', html: (p.tags || []).join(' · ') }
  ];
  const siblings = byCat(p.cat).filter(x => x.id !== id);
  const nextOne = siblings[0];
  /* 直达 demo 本体（不经介绍页）；同页跳转——demo 里有 🧭 旅程罗盘可随时滚回 */
  const href = p.url || null;
  const done = `
    <div class="btnrow">
      ${href ? `<a class="btn btn-p" href="${href}">${T('亲手玩它 →', 'Try it yourself →')}</a>` : `<span class="btn btn-g" style="opacity:.6;cursor:default">${T('即将上线', 'Coming soon')}</span>`}
      ${nextOne ? `<button class="btn btn-g" data-next="${nextOne.id}">${T(`听下一个：${nextOne.title.slice(0, 10)} →`, `Next: ${nextOne.title.slice(0, 18)} →`)}</button>` : ''}
    </div>
    ${askHtml('exp-a-s-' + id, T('这个如果用在你的业务上会怎样？', 'What if this ran on your business?'), T('你的场景 / 需求 / 吐槽…', 'Your scenario / need / gripe…'))}
    <div class="navrow">
      <button class="navlink" data-back>${T(`← 回「${p.cat}」`, `← Back to ${p.cat}`)}</button>
      <button class="navlink" data-dirs>${T('↩ 换个方向', '↩ Switch track')}</button>
      <button class="navlink" data-home>${L.hub}</button>
    </div>`;
  $('#mount', sc).appendChild(playStory(beats, done, {
    pace: 1050,
    onDone: () => {
      wireAsks(sc);
      $$('[data-next]', sc).forEach(b => b.onclick = () => go(['story', b.dataset.next]));
      $$('[data-back]', sc).forEach(b => b.onclick = () =>
        byCat(p.cat).length === 1 ? go(['dir', String(di)]) : go(['cat', String(di), p.cat]));
      $$('[data-dirs]', sc).forEach(b => b.onclick = () => go(['dirs']));
      $$('[data-home]', sc).forEach(b => b.onclick = () => go([]));
    }
  }));
  armNotes(sc, 'exp-a-s-' + id);
}

/* 单篇思考：抓原文逐句流式讲；「展开读全文」把完整原文迁入旅程内阅读，不出旅程；
   互动版同标签进入（那边左下角有🧭罗盘随时回来）；支持 #thought/<slug> 直链（罗盘回程用） */
function thoughtHrefRoute(raw, baseHref) {
  let base, url;
  try {
    base = new URL(baseHref, location.href);
    url = new URL(raw, base);
  } catch (e) {
    return { href: raw, external: true };
  }
  const siteRoot = new URL('../', base);
  if (url.origin === siteRoot.origin) {
    const thought = S.thoughts.find(item => {
      try { return new URL(item.href, location.href).pathname === url.pathname && !url.search && !url.hash; }
      catch (e) { return false; }
    });
    if (thought) {
      const name = url.pathname.slice(url.pathname.lastIndexOf('/') + 1).replace(/\.html$/, '');
      return { href: '#thought/' + encodeURIComponent(name), external: false };
    }
    const indexPath = new URL('index.html', siteRoot).pathname;
    const classicRoutes = {
      '': '#/', '#projects': '#dirs', '#thoughts': '#thoughts', '#about': '#about', '#contact': '#contact'
    };
    if (url.pathname === indexPath && !url.search && Object.prototype.hasOwnProperty.call(classicRoutes, url.hash)) {
      return { href: classicRoutes[url.hash], external: false };
    }
    if (!url.search && !url.hash && url.pathname === new URL('demos.html', siteRoot).pathname) {
      return { href: '#dirs', external: false };
    }
    if (!url.search && !url.hash && url.pathname === new URL('thoughts.html', siteRoot).pathname) {
      return { href: '#thoughts', external: false };
    }
  }
  return { href: url.href, external: true };
}
function rewriteThoughtHtml(html, baseHref) {
  const doc = new DOMParser().parseFromString('<body>' + (html || '') + '</body>', 'text/html');
  const root = doc.body;
  $$('[href], [src]', root).forEach(el => {
    if (el.hasAttribute('src')) {
      try { el.setAttribute('src', new URL(el.getAttribute('src'), new URL(baseHref, location.href)).href); }
      catch (e) {}
    }
    if (el.hasAttribute('href')) {
      const route = thoughtHrefRoute(el.getAttribute('href'), baseHref);
      el.setAttribute('href', route.href);
      if (route.external && el.tagName === 'A') {
        el.setAttribute('target', '_blank');
        el.setAttribute('rel', 'noopener');
      } else if (el.tagName === 'A') {
        el.removeAttribute('target');
        el.removeAttribute('rel');
      }
    }
  });
  return root.innerHTML;
}
async function scThought(i) {
  if (!/^(0|[1-9]\d*)$/.test(String(i))) {    /* #thought/<slug> → 按原文文件名找下标 */
    const s = String(i);
    i = S.thoughts.findIndex(x => (x.href || '').endsWith('/' + s + '.html'));
  }
  i = +i;
  const t = S.thoughts[i]; if (!t) return replaceRoute(['thoughts']);
  hit('exp-a-th' + i);
  markVisited('thoughts');
  const short = t.title.length > 9 ? t.title.slice(0, 8) + '…' : t.title;
  crumbs([[L.hub, []], [L.thoughts, ['thoughts']], [short, null]]);
  const sc = setScene(`<div class="kick">${T(`读思考 · 第 ${i + 1} / ${S.thoughts.length} 篇`, `Essays · ${i + 1} / ${S.thoughts.length}`)}</div><div id="mount"></div>`);
  const my = rendered;                        /* fetch 期间可能已切走场景 */
  let beats = [
    { cls: 'tagline', html: t.kicker },
    { cls: 'big', html: t.title },
    ...sentences(t.desc, 3).map(s => ({ html: s }))
  ];
  let fullHtml = '';                          /* 完整原文正文，展开时迁入旅程内阅读 */
  try {
    const res = await fetch(t.href);
    if (!res.ok) throw new Error('thought fetch failed');
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    const bodyEl = doc.querySelector('.article .body') || doc.querySelector('main') || doc.body;
    fullHtml = bodyEl ? rewriteThoughtHtml(bodyEl.innerHTML, t.href) : '';
    if (EN) {                                 /* 原文是中文——英文模式不流式混入中文句子 */
      if (fullHtml) beats = beats.concat([{ cls: 'dim',
        html: 'The full essay (written in Chinese) is right below — no need to leave the tour.' }]);
    } else {
      const extra = [];
      for (const el of $$('h2, p', bodyEl)) {
        if (extra.length >= 12) break;
        if (el.tagName === 'H2') extra.push({ cls: 'dim', html: '§ ' + el.textContent.trim() });
        else sentences(el.innerHTML, 2).forEach(s => { if (extra.length < 12) extra.push({ html: s }); });
      }
      if (extra.length) beats = beats.concat(extra,
        [{ cls: 'dim', html: fullHtml ? '……先讲到这，全文就在下面，不用出旅程。' : '……后面还有，完整版里见。' }]);
    }
  } catch (e) {}
  if (rendered !== my) return;                /* 已经离开，别把故事挂到别的场景上 */
  const next = S.thoughts[+i + 1];
  const done = `
    <div class="btnrow">
      ${fullHtml ? `<button class="btn btn-p" data-full>${T('📖 展开读全文', '📖 Expand the full essay')}</button>`
                 : `<a class="btn btn-p" href="${t.href}">${T('读完整原文 →', 'Read the full essay →')}</a>`}
      ${t.play ? `<a class="btn btn-g" href="${t.play}">${T('✦ 玩互动版 →', '✦ Play the interactive version →')}</a>` : ''}
      ${next ? `<button class="btn btn-g" data-next="${+i + 1}">${T(`听下一篇：${next.title.slice(0, 9)} →`, `Next essay: ${next.title.slice(0, 20)} →`)}</button>` : ''}
    </div>
    <div class="fulltext" style="display:none"></div>
    ${askHtml('exp-a-th' + i, T('这篇说的，和你的体感一致吗？', 'Does this match what you see in your field?'), T('同意 / 反对 / 它在你行业里的样子…', 'Agree / disagree / how it looks in your industry…'))}
    <div class="navrow">
      <button class="navlink" data-back>${T('← 回「读思考」', '← Back to essays')}</button>
      <button class="navlink" data-home>${L.hub}</button>
    </div>`;
  $('#mount', sc).appendChild(playStory(beats, done, {
    pace: 1050,
    onDone: () => {
      wireAsks(sc);
      $$('[data-full]', sc).forEach(b => b.onclick = () => {
        const ft = $('.fulltext', sc);
        ft.innerHTML = (EN ? '<p style="color:var(--ink-soft);font-size:13px">Note: the original essay is written in Chinese.</p>' : '') + fullHtml;
        ft.style.display = '';
        b.style.display = 'none';
      });
      $$('[data-next]', sc).forEach(b => b.onclick = () => go(['thought', b.dataset.next]));
      $$('[data-back]', sc).forEach(b => b.onclick = () => go(['thoughts']));
      $$('[data-home]', sc).forEach(b => b.onclick = () => go([]));
    }
  }));
  armNotes(sc, 'exp-a-th' + i);
}

/* ═══════════ 路由表 ═══════════ */
function render(parts) {
  if (!Array.isArray(parts)) return replaceRoute([]);
  rendered = parts.join('/');
  const [k, a, b] = parts;
  const index = raw => /^(0|[1-9]\d*)$/.test(String(raw)) ? +raw : NaN;
  if (!parts.length) return scHub();
  if (k === 'about' && parts.length === 1) return scAbout();
  if (k === 'team' && parts.length === 1) return scTeam();
  if (k === 'member' && parts.length === 2) return scMember(index(a));
  if (k === 'dirs' && parts.length === 1) return scDirs();
  if (k === 'dir' && parts.length === 2) return scDir(index(a));
  if (k === 'cat' && parts.length === 3) return scCat(index(a), b);
  if (k === 'story' && parts.length === 2) return scStory(a);
  if (k === 'thoughts' && parts.length === 1) return scThoughts();
  if (k === 'thought' && parts.length === 2) return scThought(a);
  if (k === 'ongoing' && parts.length === 1) return scOngoing();
  if (k === 'contact' && parts.length === 1) return scContact();
  return replaceRoute([]);
}
markVisited('');            /* 初始化探索度显示 */
const initialRoute = parseHash();
initialRoute ? render(initialRoute) : replaceRoute([]);
