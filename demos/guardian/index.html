  /* ---------- regex rules for dynamic sentences (run before substring pass) ---------- */
  var R = [

    [/^有一阵没看到活动了（约 (\d+) 分钟）$/, "No activity for a while (~$1 min)"],

    [/^(\d{1,2}:\d{2}) 有活动$/, "Active at $1"],

  var HAN = /[㐀-䶿一-鿿豈-﫿]/;
  var SUB = [];
  (function () {
    for (var k in D) {
      if (Object.prototype.hasOwnProperty.call(D, k) && k.trim().length >= 2 && HAN.test(k)) {
        SUB.push([k, D[k]]);
      }
    }

  function punct(x) {
    return x.replace(/。/g, ". ").replace(/，/g, ", ").replace(/：/g, ": ")
      .replace(/；/g, "; ").replace(/、/g, ", ").replace(/（/g, " (").replace(/）/g, ") ")

      .replace(/ ([.,:;!?)])/g, "$1").replace(/\( /g, "(").replace(/\s+$/, "");

  function trText(s) {
    if (!s) return null;
    if (Object.prototype.hasOwnProperty.call(D, s)) return D[s];
    var m = s.match(/^(\s*)([\s\S]*?)(\s*)$/);
    if (m && m[2] && Object.prototype.hasOwnProperty.call(D, m[2])) return m[1] + D[m[2]] + m[3];

    var r = s, i, k;
    for (i = 0; i < R.length; i++) {
      r = r.replace(R[i][0], R[i][1]);
      if (!HAN.test(r)) break;
    }
    if (HAN.test(r)) {
      for (i = 0; i < SUB.length; i++) {
        k = SUB[i][0];
        if (r.indexOf(k) !== -1) {
          r = r.split(k).join(SUB[i][1]);
          if (!HAN.test(r)) break;
        }
      }
    }
    r = punct(r);
    return r !== s ? r : null;
  }

  /* ---------- DOM application ---------- */
  var doneText = new WeakMap();   /* text node -> value we last wrote/inspected */
  var doneAttr = new WeakMap();   /* element -> { attrName: value } */
  var ATTRS = ["placeholder", "title", "aria-label"];

  function handleText(t) {
    var v = t.nodeValue;
    if (v == null || doneText.get(t) === v) return;
    var r = trText(v);
    if (r != null && r !== v) { doneText.set(t, r); t.nodeValue = r; }
    else doneText.set(t, v);
  }

  function handleAttrs(el) {
    var rec = doneAttr.get(el);
    if (!rec) { rec = {}; doneAttr.set(el, rec); }
    for (var i = 0; i < ATTRS.length; i++) {
      var a = ATTRS[i];
      if (!el.hasAttribute || !el.hasAttribute(a)) continue;
      var v = el.getAttribute(a);
      if (rec[a] === v) continue;
      var r = trText(v);
      if (r != null && r !== v) { rec[a] = r; el.setAttribute(a, r); }
      else rec[a] = v;

  function rejectEl(n) {
    var nm = n.nodeName;
    return nm === "SCRIPT" || nm === "STYLE" || nm === "NOSCRIPT" || n.id === SW_ID;
  }

  function walk(root) {
    if (!root) return;
    if (root.nodeType === 3) { handleText(root); return; }
    if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
    if (root.nodeType === 1) {
      if (rejectEl(root) || (root.closest && root.closest("#" + SW_ID))) return;
      handleAttrs(root);
    }
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
      acceptNode: function (n) {
        if (n.nodeType === 1) return rejectEl(n) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;

      }

    var n;
    while ((n = w.nextNode())) {
      if (n.nodeType === 1) handleAttrs(n);
      else handleText(n);
    }

  var pending = new Set();
  var scheduled = false;
  function flush() {
    if (!scheduled) return;                 /* rAF 与 setTimeout 双通道,先到先冲刷,幂等 */
    scheduled = false;
    var items = Array.from(pending);
    pending.clear();
    for (var i = 0; i < items.length; i++) walk(items[i]);
    syncTitle();
  }
  function schedule(node) {
    if (!node) return;
    pending.add(node);
    if (!scheduled) {
      scheduled = true;
      /* rAF 在后台标签/不渲染的视图里不会触发,必须带 setTimeout 兜底 */
      window.setTimeout(flush, 32);
      if (window.requestAnimationFrame) window.requestAnimationFrame(flush);
    }
  }

  function syncTitle() {
    var r = trText(document.title);
    if (r != null && r !== document.title) document.title = r;
  }

  var mo = new MutationObserver(function (muts) {
    for (var i = 0; i < muts.length; i++) {
      var mu = muts[i];
      if (mu.type === "characterData") schedule(mu.target);
      else if (mu.type === "attributes") schedule(mu.target);
      else if (mu.type === "childList") {
        for (var j = 0; j < mu.addedNodes.length; j++) schedule(mu.addedNodes[j]);
      }
    }
  });
  mo.observe(document.documentElement, {
    childList: true, subtree: true, characterData: true,
    attributes: true, attributeFilter: ATTRS
  });

  /* window.confirm — the sandbox reset dialog */
  var oConfirm = window.confirm.bind(window);
  window.confirm = function (msg) {
    if (typeof msg === "string") { var r = trText(msg); if (r != null) msg = r; }
    return oConfirm(msg);
  };

  /* speech announcements (elder view auto voice) */
  if (window.speechSynthesis && window.speechSynthesis.speak) {
    var oSpeak = window.speechSynthesis.speak.bind(window.speechSynthesis);
    window.speechSynthesis.speak = function (u) {
      try {
        if (u && typeof u.text === "string" && HAN.test(u.text)) {
          var r = trText(u.text);
          if (r != null) { u.text = r; u.lang = "en-US"; }
        }
      } catch (e) {}
      return oSpeak(u);
    };
  }

  document.documentElement.lang = "en";
  syncTitle();
  walk(document.documentElement);
  window.__ovlTr = trText; /* debug hook */
})();
